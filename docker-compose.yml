version: "3.8"

services:
  # Service 1: Prometheus (The Collector & Database)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Mount your local prometheus.yml into the container
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Keep historical metrics data persisted even if container restarts
      - prometheus_data:/prometheus
    extra_hosts:
      # Ensures Linux/Mac/Windows can all resolve host.docker.internal properly
      - "host.docker.internal:host-gateway"

  # Service 2: Grafana (The Visual Dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000" # Mapped to 3001 so it doesn't conflict with your Hono app (if it uses 3000)
    volumes:
      # Saves your dashboards and panels so they don't disappear on restart
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data: