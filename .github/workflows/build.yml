name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zhini-co-in/kondaas

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.repository == 'zhini-co-in/kondaas-service'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate Daily Version Tag
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Format today's date: YYMMDD
          DATE_TAG=$(date +'%y%m%d')
          PREFIX="2.0.${DATE_TAG}"

          # 2. Query GHCR for existing package version tags for today
          BUILD_COUNT=$(gh api -H "Accept: application/vnd.github+json" \
            /orgs/zhini-co-in/packages/container/kondaas/versions --paginate 2>/dev/null \
            | jq -r '.[].metadata.container.tags[]?' 2>/dev/null \
            | grep "^${PREFIX}" | wc -l || echo 0)

          # 3. Increment counter: if 0 exists, next is 01; if 1 exists, next is 02
          NEXT_BUILD=$((BUILD_COUNT + 1))
          FORMATTED_BUILD=$(printf "%02d" $NEXT_BUILD)

          FULL_TAG="${PREFIX}${FORMATTED_BUILD}"
          echo "tag=${FULL_TAG}" >> $GITHUB_OUTPUT
          echo "Generated Daily Version Tag: ${FULL_TAG}"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          no-cache: true
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.versioning.outputs.tag }}